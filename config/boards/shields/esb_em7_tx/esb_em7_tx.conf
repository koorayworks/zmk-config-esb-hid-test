# EM7 v1 bring-up: USB wired only, so the PMW3610 / buttons / ring
# wiring can be verified on hardware without radio variables.
# Step 2 (later): enable BLE + ESB (slot 3; TentAlice=0, Nickey=1,
# koZakura=2 are taken) and &out OUT_TOG three-way switching.
CONFIG_ZMK_USB=y
CONFIG_ZMK_BLE=n

# ZMK Studio over USB. Build with the studio-rpc-usb-uart snippet:
#   west build ... -- -DSNIPPET=studio-rpc-usb-uart
CONFIG_ZMK_STUDIO=y
# No &studio_unlock key in this keymap, so locking stays off
# (same choice as the other TX shields in this repo).
CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_ZMK_USB_LOGGING=y

# EM7 hardware
CONFIG_ZMK_POINTING=y
CONFIG_INPUT_PMW3610=y
CONFIG_INPUT_GPIO_QDEC=y
CONFIG_INPUT_THREAD_STACK_SIZE=2048

# No battery on this board (USB powered): no battery reporting.
CONFIG_ZMK_BATTERY_REPORTING=n
