# Touch bring-up test v4: mirror prospector-bridge, where touch
# works on this hardware — the CST816S driver runs in INTERRUPT
# mode there (irq-gpios on D0). This fragment is merged after
# esb_nape_rx.conf (shield order: rx;disptest;touchtest), so it
# overrides the rx layer's CONFIG_INPUT_CST816S_INTERRUPT=n.
CONFIG_INPUT_CST816S_INTERRUPT=y

# LVGL button widget for the tap counter screen (labels are
# already enabled by esb_nape_rx.conf).
CONFIG_LV_USE_BUTTON=y
