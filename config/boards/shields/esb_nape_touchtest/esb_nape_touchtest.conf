# Touch bring-up test extras. The touch driver mode itself
# (CONFIG_INPUT_CST816S_INTERRUPT=y) moved down to
# esb_nape_disptest.conf with the Step 2 production integration;
# this fragment is merged after it (shield order:
# rx;disptest;touchtest) and only adds the LVGL widgets the test
# screens need.

# LVGL button widget for the tap counter screen (labels are
# already enabled by esb_nape_rx.conf).
CONFIG_LV_USE_BUTTON=y

# Canvas for the test-pattern screen's true 1 px checkerboard
# (static display sharpness bisect).
CONFIG_LV_USE_CANVAS=y

# Bitmap font for pattern page 2 (touch_test.c v7): unscii glyphs
# are 1 bpp with no antialiasing, making them the control for the
# AA text-smear bisect. unscii_8 is already enabled by the config
# chain; unscii_16 needs this explicit line.
CONFIG_LV_FONT_UNSCII_16=y

# Custom-font comparison samples on pattern page 2 (touch_test.c
# v8) need the SemiBold/Bold 20 fonts linked in. The disptest
# layer already enables this for the status UI; repeated here so
# the touchtest layer states its own dependency.
CONFIG_ESB_NAPE_RX_CUSTOM_FONT=y

# Font ladder for the stacked status UI (top wins): BPP1 over
# BPP8 over bpp 4 over stock. BPP1 is the production setting
# (hardware-verified clean 2026-11-06) and drives the status UI
# in this build too.
CONFIG_ESB_NAPE_RX_FONT_BPP1=y

# BPP8 stays ON here on purpose: pattern page 2's first SemiBold
# sample line follows this switch (not the BPP1-priority ladder)
# so the page keeps comparing BPP8 / BPP4 / BPP1 / BPP1-14 as
# built. It no longer selects the status UI font — BPP1 above
# outranks it there.
CONFIG_ESB_NAPE_RX_FONT_BPP8=y
