# Touch bring-up test extras. The touch driver mode itself
# (CONFIG_INPUT_CST816S_INTERRUPT=y) moved down to
# esb_nape_disptest.conf with the Step 2 production integration;
# this fragment is merged after it (shield order:
# rx;disptest;touchtest) and only adds the LVGL widgets the test
# screens need.

# LVGL button widget for the tap counter screen (labels are
# already enabled by esb_nape_rx.conf).
CONFIG_LV_USE_BUTTON=y

# Canvas for the test-pattern screen's true 1 px checkerboard
# (static display sharpness bisect).
CONFIG_LV_USE_CANVAS=y

# Bitmap font for pattern page 2 (touch_test.c v7): unscii glyphs
# are 1 bpp with no antialiasing, making them the control for the
# AA text-smear bisect. unscii_8 is already enabled by the config
# chain; unscii_16 needs this explicit line.
CONFIG_LV_FONT_UNSCII_16=y
