# ESB HID receiver (Step 1 stack, same as esb_test_rx)
CONFIG_ZMK_BLE=n
CONFIG_ZMK_USB=y
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_ESB_HID_RECEIVER=y
CONFIG_ESB_MAX_PAYLOAD_LENGTH=64
CONFIG_ZMK_USB_LOGGING=y

# Display: ST7789V 240x280 + LVGL, own status screen (black UI design)
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=8192
CONFIG_LV_Z_MEM_POOL_SIZE=16384
CONFIG_LV_USE_LABEL=y

# Input subsystem: PAW3222 trackball + CST816S touch (polling, no INT pin)
CONFIG_INPUT=y
CONFIG_PAW3222=y
CONFIG_INPUT_CST816S=y
CONFIG_INPUT_CST816S_INTERRUPT=n
