# ESB HID receiver (Step 1 stack, same as esb_test_rx)
CONFIG_ZMK_BLE=n
CONFIG_ZMK_USB=y
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_ESB_HID_RECEIVER=y
CONFIG_ESB_MAX_PAYLOAD_LENGTH=64
CONFIG_ZMK_USB_LOGGING=y

# Display: ST7789V 240x280 + LVGL, own status screen (black UI design)
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=8192
CONFIG_LV_Z_MEM_POOL_SIZE=49152
CONFIG_LV_USE_LABEL=y
# Buttons for the Step 2 Deck UI (tab bar / slot rows / detail
# actions in src/status_screen.c, compiled into every nape build).
CONFIG_LV_USE_BUTTON=y
CONFIG_LV_FONT_MONTSERRAT_12=y
CONFIG_LV_FONT_MONTSERRAT_14=y
CONFIG_LV_FONT_MONTSERRAT_16=y
CONFIG_LV_FONT_MONTSERRAT_20=y
CONFIG_LV_FONT_MONTSERRAT_28=y
CONFIG_LED=y
CONFIG_LED_PWM=y
CONFIG_PWM=y
# Own battery readout for the status screen (no BLE in this build, so
# the usual imply from ZMK_BLE does not apply).
CONFIG_ZMK_BATTERY_REPORTING=y

# Input subsystem: PAW3222 trackball + CST816S touch (polling, no INT pin)
CONFIG_INPUT=y
CONFIG_PAW3222=y
CONFIG_INPUT_CST816S=y
CONFIG_INPUT_CST816S_INTERRUPT=n

# Studio over ESB forwarder (see esb_test_rx)
CONFIG_ZMK_ESB_HID_STUDIO_RX=y
CONFIG_USB_CDC_ACM=y
CONFIG_SERIAL=y

# BIOS / UEFI boot protocol for the USB HID interface. The PC only
# ever sees this receiver, so this is what decides whether the
# keyboard works in a BIOS setup screen; the keyboards (TX side)
# are unaffected. ZMK_USB_BOOT selects Zephyr's USB_HID_BOOT_PROTOCOL.
CONFIG_ZMK_USB_BOOT=y

# Headless pairing: without a display there is no UI to open the
# pairing window, so the receiver opens it automatically at boot
# for the first free slot and assigns the first candidate that
# asks (the usual 60 s window, no manual confirm). The Deck build
# turns this back off in esb_nape_disptest.conf — it has the
# touch UI and keeps pairing under explicit user control.
CONFIG_ZMK_ESB_HID_RX_BOOT_PAIRING=y
