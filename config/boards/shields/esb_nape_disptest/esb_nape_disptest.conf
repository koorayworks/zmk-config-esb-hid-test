# Production Deck build (Step 2): the CST816T touch controller now
# lives on this layer (see esb_nape_disptest.overlay — i2c1 via the
# Scanner harness, prospector-bridge recipe). Shield .conf fragments
# are merged in shield order (rx;disptest;touchtest), so this
# overrides esb_nape_rx.conf's CONFIG_INPUT_CST816S_INTERRUPT=n:
# the driver runs in interrupt mode with irq-gpios on D0, as proven
# by esb_nape_touchtest v4 on this hardware.
CONFIG_INPUT_CST816S_INTERRUPT=y

# Display draw buffers, following the Prospector Scanner firmware
# (same panel/driver, no visible smearing there): double buffered,
# as large per buffer as RAM allows. The Scanner's 30% did not fit
# here (link overflowed RAM by ~5 KB); 25% is the largest size that
# keeps double buffering with real headroom on this build. Ours
# shipped at the ZMK default of 10% / single, which flushes the
# panel in thin bands.
CONFIG_LV_Z_VDB_SIZE=25
CONFIG_LV_Z_DOUBLE_VDB=y

# Custom-converted Montserrat SemiBold for the status UI (the
# stock Medium's antialiasing smears on this panel at every size;
# shapes are pixel-perfect, so the fix is typographic). The
# fonts live in esb_nape_rx/src/fonts/ and status_screen.c routes
# its sizes through FONT_16/20/28 — dropping this line reverts
# the whole Deck UI to the stock fonts.
CONFIG_ESB_NAPE_RX_CUSTOM_FONT=y

# Font ladder (top wins):
#   BPP1=y (below) + CUSTOM_FONT=y -> SemiBold bpp 1 (this build)
#   BPP8=y + CUSTOM_FONT=y         -> SemiBold bpp 8
#   CUSTOM_FONT=y only             -> SemiBold bpp 4
#   all off                        -> stock LVGL Montserrat Medium
# Hardware verdict (2026-11-06): bpp 4 and bpp 8 both smeared —
# partial-coverage pixels come out colored on this panel — while
# the bpp 1 samples rendered clean, so bpp 1 is the production
# setting, not a test. The BPP8 line is gone (not just off) so
# the selection cannot be misread; the ladder still honors it
# if it is ever set again.
CONFIG_ESB_NAPE_RX_FONT_BPP1=y
