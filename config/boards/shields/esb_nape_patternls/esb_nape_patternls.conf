# Landscape pattern bisect variant: switch the touchtest app into
# its landscape mode — the static test pattern is shown first at
# boot, laid out compactly for 280x240 (see
# esb_nape_touchtest/src/touch_test.c). Shield .conf fragments are
# merged in shield order (rx;disptest;touchtest;patternls) and
# nothing else sets this symbol, so the assignment is unambiguous.
# The panel geometry itself is overridden in
# esb_nape_patternls.overlay.
CONFIG_ESB_NAPE_TOUCHTEST_LANDSCAPE_PATTERN=y
