CONFIG_ZMK_USB=n
CONFIG_ZMK_BLE=n
CONFIG_ZMK_ESB_HID=y

# Step 2 multi-device registry: this TX claims slot 1 and announces
# itself to the receiver as "Nickey".
CONFIG_ZMK_ESB_HID_SLOT=1
CONFIG_ZMK_ESB_HID_DEVICE_NAME="Nickey"
CONFIG_ESB_MAX_PAYLOAD_LENGTH=64
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_USB_LOGGING=y
