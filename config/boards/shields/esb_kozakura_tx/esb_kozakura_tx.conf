CONFIG_ZMK_USB=n
CONFIG_ZMK_BLE=n
CONFIG_ZMK_ESB_HID=y

# Step 2 multi-device registry: this TX claims slot 2 and announces
# itself to the receiver as "koZakura".
CONFIG_ZMK_ESB_HID_SLOT=2
CONFIG_ZMK_ESB_HID_DEVICE_NAME="koZakura"
CONFIG_ESB_MAX_PAYLOAD_LENGTH=64
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_USB_LOGGING=y

# The koZakura keymap uses &mkp on its mouse layer (no pointing
# device is attached in this build; the trackball is omitted, see
# the shield overlay).
CONFIG_ZMK_POINTING=y
