# Dual-mode: ESB (via the receiver) or wired USB HID, switchable from
# the keymap with &out (layer 5, OUT_TOG cycles USB <-> ESB in this
# build). BLE stays off, so the fork's endpoint fallback is ESB <-> USB.
CONFIG_ZMK_USB=y
CONFIG_ZMK_BLE=n
CONFIG_ZMK_ESB_HID=y

# ZMK Studio keymap editing over ESB (via the receiver's USB CDC
# forwarder). The Studio RPC transport is the module's ESB transport;
# the stock UART/BLE transports must stay off.
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_TRANSPORT_UART=n
CONFIG_ZMK_STUDIO_TRANSPORT_BLE=n
CONFIG_ZMK_ESB_HID_STUDIO=y
# Prototype: no &studio_unlock key in this keymap, so Studio locking
# is disabled (same choice as sekigon's torabo-tsuki-lp).
CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_ESB_MAX_PAYLOAD_LENGTH=64
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_USB_LOGGING=y

# TentAlice hardware (from zmk-config-tentalice)
CONFIG_ZMK_POINTING=y
CONFIG_INPUT_PMW3610=y
CONFIG_INPUT_THREAD_STACK_SIZE=2048
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=15
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=15
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n

