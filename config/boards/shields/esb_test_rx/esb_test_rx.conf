CONFIG_ZMK_BLE=n
CONFIG_ZMK_USB=y
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_ESB_HID_RECEIVER=y
CONFIG_ESB_MAX_PAYLOAD_LENGTH=64
CONFIG_ZMK_USB_LOGGING=y

# Studio over ESB forwarder: second USB CDC ACM port (node
# esb_studio_cdc in the shield overlay) bridged to the ESB link.
CONFIG_ZMK_ESB_HID_STUDIO_RX=y
CONFIG_USB_CDC_ACM=y
CONFIG_SERIAL=y
